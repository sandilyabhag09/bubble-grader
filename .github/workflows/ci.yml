name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest -q
        env:
          # Belt and suspenders — conftest also forces these, so tests can
          # never reach the shared production database.
          DATABASE_URL: ""
          FERNET_KEY: "ci-test-key"
